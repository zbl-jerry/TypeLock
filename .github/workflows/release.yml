name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore annotated release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release tag::Releases must use vX.Y.Z without leading zeros. Got ${RELEASE_TAG}."
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}" 2>/dev/null || true)" != "tag" ]]; then
            echo "::error title=Invalid release tag::Tag ${RELEASE_TAG} must be an annotated tag."
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [[ "$HEAD_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "::error title=Release source mismatch::Checked out ${HEAD_COMMIT}, expected tag commit ${TAG_COMMIT}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/dev; then
            echo "::error title=Release tag not on dev::Tag ${RELEASE_TAG} is not contained in origin/dev."
            exit 1
          fi

          git tag --merged origin/dev --list 'v*' |
            ruby script/validate_release_order.rb "$RELEASE_TAG"

      - name: Ensure GitHub Release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: script/ensure_release_absent.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG"

      - name: Check Sparkle signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::error title=Missing Sparkle signing key::Set the SPARKLE_ED_PRIVATE_KEY repository secret before publishing a release."
            exit 1
          fi

      - name: Check licenses
        run: script/check_licenses.sh

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Install Tuist
        run: brew install tuist

      - name: Generate Xcode Project
        env:
          TUIST_APP_VERSION: ${{ github.ref_name }}
        run: |
          TUIST_APP_VERSION="${TUIST_APP_VERSION#v}"
          export TUIST_APP_VERSION
          TUIST_BUILD_VERSION=$(date -u "+%Y%m%d%H%M")
          export TUIST_BUILD_VERSION
          tuist generate --no-open

      - name: Test
        run: |
          xcodebuild test \
            -project TypeLock.xcodeproj \
            -scheme TypeLock \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive App
        run: |
          xcodebuild \
            -project TypeLock.xcodeproj \
            -scheme TypeLock \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath ./DerivedData/Archives/TypeLock.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64"

      - name: Verify Universal Binary
        run: |
          BINARY_PATH="DerivedData/Archives/TypeLock.xcarchive/Products/Applications/TypeLock.app/Contents/MacOS/TypeLock"
          ARCHITECTURES=$(lipo -archs "$BINARY_PATH")
          if [[ " $ARCHITECTURES " != *" arm64 "* || " $ARCHITECTURES " != *" x86_64 "* ]]; then
            echo "::error title=Invalid binary architectures::Expected arm64 and x86_64, got ${ARCHITECTURES}."
            exit 1
          fi

      - name: Package App
        run: |
          mkdir -p DerivedData/Exports
          ditto DerivedData/Archives/TypeLock.xcarchive/Products/Applications/TypeLock.app DerivedData/Exports/TypeLock.app
          ditto -c -k --sequesterRsrc --keepParent DerivedData/Exports/TypeLock.app TypeLock-macOS-universal.zip

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! awk -v heading="## ${RELEASE_TAG}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md; then
            echo "::error title=Missing release notes::CHANGELOG.md does not contain a ## ${RELEASE_TAG} section."
            exit 1
          fi

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error title=Missing release notes::CHANGELOG.md must contain a non-empty ## ${RELEASE_TAG} section."
            exit 1
          fi

      - name: Generate Checksums
        run: |
          ASSET_NAME="TypeLock-macOS-universal.zip"
          SHA256=$(shasum -a 256 "$ASSET_NAME" | awk '{print $1}')

          {
            echo "### SHA-256 Checksums"
            echo '```'
            echo "$SHA256  $ASSET_NAME"
            echo '```'
          } > checksums.txt

          {
            echo "## TypeLock ${{ github.ref_name }}"
            echo
            cat release-notes.md
            echo
            echo "### Build"
            echo
            echo "- Universal Binary (Apple Silicon + Intel)"
            echo "- macOS 14.0+"
            echo
            cat checksums.txt
          } > release-body.md

      - name: Download Sparkle tools
        run: |
          SPARKLE_ARCHIVE="Sparkle-2.9.4.tar.xz"
          EXPECTED_SHA256="ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9"
          curl -fsSL -o "$SPARKLE_ARCHIVE" "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/$SPARKLE_ARCHIVE"

          ACTUAL_SHA256=$(shasum -a 256 "$SPARKLE_ARCHIVE" | awk '{print $1}')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error title=Sparkle checksum mismatch::Expected ${EXPECTED_SHA256}, got ${ACTUAL_SHA256}."
            exit 1
          fi

          mkdir -p sparkle-tools
          tar -xf "$SPARKLE_ARCHIVE" -C sparkle-tools --strip-components=1

      - name: Generate Sparkle appcast
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p DerivedData/SparkleFeed
          cp TypeLock-macOS-universal.zip DerivedData/SparkleFeed/
          cp release-notes.md DerivedData/SparkleFeed/TypeLock-macOS-universal.md

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | ./sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --embed-release-notes \
            --maximum-versions 1 \
            DerivedData/SparkleFeed

          cp DerivedData/SparkleFeed/appcast.xml appcast.xml

      - name: Verify release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: script/verify_release.sh "$RELEASE_TAG" .

      - name: Attest release artifact
        uses: actions/attest@v4
        with:
          subject-path: TypeLock-macOS-universal.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TypeLock-macOS-universal.zip
            checksums.txt
            appcast.xml
          body_path: release-body.md
          draft: false
          prerelease: false
          overwrite_files: false
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
